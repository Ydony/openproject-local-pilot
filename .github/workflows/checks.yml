name: checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static and synthetic checks (no Docker daemon needed)
        run: python3 -m unittest discover -s tests -v
